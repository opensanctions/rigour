[build-system]
requires = ["maturin>=1.13,<2.0"]
build-backend = "maturin"

[project]
name = "rigour"
version = "2.4.0"
description = "Financial crime domain data validation and normalization library."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "OpenSanctions", email = "info@opensanctions.org" }]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
]
requires-python = ">= 3.10"
dependencies = [
    "pyyaml >= 5.0.0, < 7.0.0",
    "normality >= 3.0.1, < 4.0.0",
    "prefixdate >= 0.5.0, < 1.0.0",
    "orjson >= 3.0.0, < 4.0.0",
    "python-stdnum >= 2.0, < 3.0.0",
    "jinja2 >= 3.1.0, < 4.0.0",
]

[project.urls]
Documentation = "https://rigour.followthemoney.tech/"
Repository = "https://github.com/opensanctions/rigour.git"
Issues = "https://github.com/opensanctions/rigour/issues"

[project.optional-dependencies]
dev = [
    "pip>=10.0.0",
    "bump2version",
    "wheel>=0.29.0",
    "ruamel.yaml",
    # Bounded on purpose: ruff's default rule selection moves between minor
    # releases, so an unpinned range would change what `ruff check` reports
    # without any change to this repo. genscripts/util.py also formats the
    # generated data tables with it, so a bump can shift those files too.
    "ruff >= 0.16.0, < 0.17.0",
    "build",
    "twine",
    "mypy",
    "pytest",
    "pytest-cov",
    "types-PyYAML",
    "types-setuptools",
    "coverage>=4.1",
]
docs = [
    "pillow",
    "cairosvg",
    "mkdocs",
    "mkdocstrings[python]",
    "mkdocs-material",
]

[tool.maturin]
# pyo3/generate-import-lib lets the Windows wheel job link without a
# real Python install (PyO3 generates a stub import library).
features = ["pyo3/extension-module", "pyo3/generate-import-lib", "python"]
module-name = "rigour._core"
manifest-path = "rust/Cargo.toml"
# `rigour/` is the Python package directory, sitting at the repo root. Maturin
# picks it up automatically; no `python-source` override needed.
include = [
    { path = "rigour/py.typed", format = "sdist" },
    { path = "rigour/_core.pyi", format = "sdist" },
]

[tool.ruff.lint]
ignore = [
    # `from x import y as y` is the explicit re-export form that mypy requires
    # under no_implicit_reexport (implied by --strict). Ruff exempts it in
    # __init__.py and stubs, but not in plain modules, so it fires on the
    # modules that re-export symbols out of the Rust extension
    # (rigour.names.pick, rigour.text.translit). Dropping the alias there
    # would break `from rigour.names.pick import pick_name` for any
    # strict-mode consumer.
    "PLC0414",
]

[tool.coverage.run]
branch = true
